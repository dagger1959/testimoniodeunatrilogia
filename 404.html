<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Testimonio de una Trilogía</title>
    <script type="text/javascript">
      // Redirige la navegación de GitHub Pages al router de la app
      var segment = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segment).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segment).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
